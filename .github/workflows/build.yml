name: Build & Release

on:
  push:
    branches:
      - main
      - streaming-pipeline-rewrite
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 cmake;3.22.1'

      - name: Build Receiver APK
        working-directory: receiver
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          cp receiver/app/build/outputs/apk/debug/app-debug.apk dist/linky-receiver.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linky-receiver-apk
          path: dist/linky-receiver.apk
          if-no-files-found: error

  build-linux:
    name: Build Linux Packages (DEB, RPM, AppImage, Tarball)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake pkg-config nasm git file wget \
            opus libva libpulse libxcb libx11 libxext wayland wayland-protocols \
            avahi glib2 openssl gtk4 libadwaita fuse2

      - name: Build Static FFmpeg
        run: |
          git clone --depth 1 --branch release/8.1 https://github.com/FFmpeg/FFmpeg /opt/ffmpeg-src
          cd /opt/ffmpeg-src
          ./configure --prefix=/opt/ffmpeg-static --disable-shared --enable-static \
            --disable-programs --disable-doc --disable-network --disable-autodetect \
            --enable-avcodec --enable-avformat --enable-avdevice \
            --enable-swscale --enable-swresample --enable-avutil \
            --enable-encoder=libopus,hevc_vaapi,h264_vaapi \
            --enable-indev=xcbgrab --enable-vaapi --enable-libopus
          make -j$(nproc)
          make install

      - name: Configure and Build Linky Sender
        working-directory: sender
        run: |
          export PKG_CONFIG_PATH=/opt/ffmpeg-static/lib/pkgconfig
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Generate CPack Packages (DEB, RPM, Tarball)
        working-directory: sender/build
        run: |
          cpack -G TGZ
          cpack -G DEB || true
          cpack -G RPM || true
          mkdir -p ../../dist
          cp *.tar.gz ../../dist/linky-sender-linux-x86_64.tar.gz
          cp *.deb ../../dist/ || true
          cp *.rpm ../../dist/ || true

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp sender/build/linky-desktop AppDir/usr/bin/
          cp sender/build/linky-stream AppDir/usr/bin/
          cp sender/build/linky-tray AppDir/usr/bin/
          cp sender/build/linky-dumpreceiver AppDir/usr/bin/
          cp sender/linky.desktop AppDir/
          cp sender/linky.desktop AppDir/usr/share/applications/
          cp sender/resources/icons/linky.svg AppDir/
          cp sender/resources/icons/linky.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          
          # AppRun script
          cat << 'EOF_RUN' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/linky-desktop" "$@"
          EOF_RUN
          chmod +x AppDir/AppRun

          # Descargar appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
          
          # Generar AppImage con --appimage-extract-and-run (para entornos container sin FUSE)
          /usr/local/bin/appimagetool --appimage-extract-and-run AppDir dist/linky-sender-x86_64.AppImage

      - name: Upload Linux Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linky-linux-packages
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release on Tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-apk, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release_assets/linky-receiver-apk/*.apk \
            release_assets/linky-linux-packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Linky $GITHUB_REF_NAME" \
            --generate-notes
