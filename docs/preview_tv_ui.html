<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Linky — Minimalist TV UI Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    body { background: #000000; color: #f4f4f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    
    .nav-tabs {
      display: flex; gap: 8px; margin-bottom: 24px;
      background: #18181b; padding: 6px; border-radius: 999px;
      border: 1px solid #27272a;
    }
    .nav-tabs button {
      background: transparent; color: #a1a1aa; border: none; padding: 8px 18px;
      border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-tabs button.active, .nav-tabs button:hover { background: #ffffff; color: #09090b; }

    /* Marco 16:9 TV */
    .tv-frame {
      width: 1066px;
      height: 600px;
      background: #09090b;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 0 1px #27272a;
      position: relative;
      display: flex;
    }

    /* Standby Screen */
    .standby-screen {
      width: 100%;
      height: 100%;
      background: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px;
      position: relative;
      z-index: 1;
    }

    .brand-title {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 16px;
      color: #a1a1aa;
      font-weight: 400;
    }

    /* Status Pill */
    .info-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #27272a;
      padding: 10px 24px;
      border-radius: 999px;
      margin-top: 36px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }
    .info-name { font-size: 15px; font-weight: 700; color: #ffffff; }
    .info-divider { color: #52525b; font-size: 14px; }
    .info-ip { font-size: 15px; font-family: ui-monospace, monospace; color: #a1a1aa; }

    /* Horizontal D-Pad Navigation Buttons */
    .actions-row {
      display: flex;
      gap: 20px;
      margin-top: 40px;
    }
    .tv-btn {
      width: 190px;
      height: 52px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid #27272a;
      background: rgba(255, 255, 255, 0.06);
      color: #e4e4e7;
    }
    /* D-Pad Focused State: Pure White background + Black text + Scale */
    .tv-btn.focused, .tv-btn:focus, .tv-btn:hover {
      background: #ffffff;
      color: #09090b;
      border-color: #ffffff;
      transform: scale(1.06);
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .footer-hint {
      position: absolute;
      bottom: 28px;
      font-size: 13px;
      color: #71717a;
    }

    /* Modal Dialog */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }
    .modal-card {
      width: 440px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 36px;
      text-align: left;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
    }
    .modal-title { font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em; }
    .modal-desc { font-size: 15px; color: #a1a1aa; line-height: 1.5; margin-top: 10px; }
    .modal-actions { display: flex; gap: 14px; margin-top: 32px; }
    .modal-actions .tv-btn { flex: 1; width: auto; }

    /* Minimal HUD */
    .hud-overlay {
      position: absolute;
      top: 24px; right: 24px;
      background: rgba(9, 9, 11, 0.88);
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 10px 18px;
      z-index: 5;
      text-align: right;
      backdrop-filter: blur(8px);
    }
    .hud-title { font-size: 13px; font-weight: 700; color: #ffffff; font-family: ui-monospace, monospace; }
    .hud-sub { font-size: 12px; color: #a1a1aa; font-family: ui-monospace, monospace; margin-top: 2px; }

    /* Video Screen Simulation */
    .video-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 0;
    }
    .video-content {
      color: #71717a;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>

  <div class="nav-tabs">
    <button class="active" onclick="switchTab('standby')">1. Pantalla Standby (Minimalista)</button>
    <button onclick="switchTab('dialog')">2. Diálogo Modal (Foco D-Pad)</button>
    <button onclick="switchTab('streaming')">3. Streaming en Directo (Con HUD)</button>
  </div>

  <div class="tv-frame">
    <!-- Capa de vídeo -->
    <div class="video-layer" id="videoLayer" style="display: none;">
      <div class="video-content">Duplicando Pantalla de Linux (1080p @ 60 FPS)</div>
    </div>

    <!-- Standby Minimalista -->
    <div class="standby-screen" id="standbyScreen">
      <div class="brand-title">Linky</div>
      <div class="brand-subtitle">Esperando conexión…</div>

      <div class="info-pill">
        <div class="status-dot"></div>
        <div class="info-name">Android TV</div>
        <div class="info-divider">·</div>
        <div class="info-ip">192.168.1.45</div>
      </div>

      <div class="actions-row">
        <button class="tv-btn focused" tabindex="1">Apagar Receptor</button>
        <button class="tv-btn" tabindex="2">AirPlay (Apple)</button>
      </div>

      <div class="footer-hint">Ejecuta <code>linky-stream</code> en tu PC Linux para duplicar pantalla</div>
    </div>

    <!-- Modal Dialog -->
    <div class="modal-overlay" id="modalDialog" style="display: none;">
      <div class="modal-card">
        <div class="modal-title">Solicitud de Conexión</div>
        <div class="modal-desc">El equipo <strong>«PC-Linux-Emixdy»</strong> desea transmitir su pantalla.</div>
        <div class="modal-actions">
          <button class="tv-btn focused">Permitir</button>
          <button class="tv-btn">Rechazar</button>
        </div>
      </div>
    </div>

    <!-- Minimal HUD -->
    <div class="hud-overlay" id="hudOverlay" style="display: none;">
      <div class="hud-title">HEVC HW · 1080p60</div>
      <div class="hud-sub">8.4 Mbps · 0 NACKs</div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const standby = document.getElementById('standbyScreen');
      const dialog = document.getElementById('modalDialog');
      const hud = document.getElementById('hudOverlay');
      const video = document.getElementById('videoLayer');

      if (tab === 'standby') {
        standby.style.display = 'flex';
        video.style.display = 'none';
        dialog.style.display = 'none';
        hud.style.display = 'none';
      } else if (tab === 'dialog') {
        standby.style.display = 'flex';
        video.style.display = 'none';
        dialog.style.display = 'flex';
        hud.style.display = 'none';
      } else if (tab === 'streaming') {
        standby.style.display = 'none';
        video.style.display = 'flex';
        dialog.style.display = 'none';
        hud.style.display = 'block';
      }
    }
  </script>
</body>
</html>
